<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ハンドベル</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: sans-serif;
        text-align: center;
        touch-action: manipulation;
    }

    h1 {
        margin: 18px 0 8px;
        font-size: 26px;
    }

    #current {
        font-size: 56px;
        font-weight: bold;
        margin: 10px 0 20px;
    }

    #status {
        font-size: 15px;
        color: #aaa;
        margin-bottom: 15px;
    }

    #enable {
        font-size: 18px;
        padding: 14px 25px;
        border-radius: 10px;
        border: none;
        background: #444;
        color: white;
        margin-bottom: 20px;
    }

    .notes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px;
        max-width: 500px;
        margin: auto;
    }

    .note {
        height: 60px;
        border: none;
        border-radius: 10px;
        background: #333;
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    .note:active {
        background: #777;
        transform: scale(0.95);
    }

    .note.selected {
        background: #eee;
        color: #111;
    }

    #bell {
        margin: 20px auto;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
    }

    #bell.ringing {
        transform: rotate(-15deg);
    }

    .hint {
        color: #888;
        font-size: 14px;
        padding: 0 20px 20px;
    }
</style>
</head>

<body>

<h1>🔔 ハンドベル</h1>

<div id="current">C4</div>

<div id="status">
    音を選んでください
</div>

<button id="enable">
    センサーを有効にする
</button>

<div id="bell">🔔</div>

<div class="notes" id="notes"></div>

<div class="hint">
    音を選んだら、スマホをハンドベルのように振ってください。
</div>

<script>

let audioContext = null;
let currentNote = "C4";

let lastShake = 0;

// 振動検出用
let lastMagnitude = 0;
let shakeThreshold = 16;

// 音名
const noteNames = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
];

// C4 ～ B5
const notes = [];

for (let octave = 4; octave <= 5; octave++) {
    for (let n of noteNames) {
        notes.push(n + octave);
    }
}


// ----------------------------
// 音程 → 周波数
// ----------------------------

function frequency(note) {

    const match = note.match(/^([A-G]#?)([0-9])$/);

    const name = match[1];
    const octave = Number(match[2]);

    const index = noteNames.indexOf(name);

    // A4 = 440Hz
    const midi = (octave + 1) * 12 + index;

    return 440 * Math.pow(2, (midi - 69) / 12);
}


// ----------------------------
// ボタン生成
// ----------------------------

const notesContainer = document.getElementById("notes");

notes.forEach(note => {

    const button = document.createElement("button");

    button.className = "note";
    button.textContent = note;

    button.addEventListener("click", () => {

        currentNote = note;

        document.getElementById("current").textContent = note;

        document.querySelectorAll(".note")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        document.getElementById("status").textContent =
            "設定：" + note;

        // ボタンを押したときにも軽く鳴らす
        playBell(note, 0.8);
    });

    notesContainer.appendChild(button);
});


// 初期選択
document.querySelector(".note").classList.add("selected");


// ----------------------------
// AudioContext
// ----------------------------

function initAudio() {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


// ----------------------------
// ハンドベル音
// ----------------------------

function playBell(note, volume = 1) {

    initAudio();

    const ctx = audioContext;

    const now = ctx.currentTime;

    const f = frequency(note);

    const master = ctx.createGain();

    master.gain.setValueAtTime(0, now);

    master.gain.linearRampToValueAtTime(
        0.45 * volume,
        now + 0.005
    );

    master.gain.exponentialRampToValueAtTime(
        0.001,
        now + 2.2
    );

    master.connect(ctx.destination);


    // 金属的な倍音
    const partials = [
        { ratio: 1.00, gain: 1.0 },
        { ratio: 2.01, gain: 0.55 },
        { ratio: 3.01, gain: 0.30 },
        { ratio: 4.02, gain: 0.18 },
        { ratio: 5.03, gain: 0.10 },
        { ratio: 7.02, gain: 0.06 }
    ];


    partials.forEach(p => {

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            f * p.ratio,
            now
        );

        gain.gain.setValueAtTime(
            p.gain,
            now
        );

        osc.connect(gain);
        gain.connect(master);

        osc.start(now);
        osc.stop(now + 2.3);
    });


    // 高域の「チン」というアタック音
    const attack = ctx.createOscillator();
    const attackGain = ctx.createGain();

    attack.type = "triangle";

    attack.frequency.setValueAtTime(
        f * 8,
        now
    );

    attackGain.gain.setValueAtTime(
        0.12 * volume,
        now
    );

    attackGain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.25
    );

    attack.connect(attackGain);
    attackGain.connect(ctx.destination);

    attack.start(now);
    attack.stop(now + 0.3);


    // 見た目
    const bell = document.getElementById("bell");

    bell.classList.add("ringing");

    setTimeout(() => {
        bell.classList.remove("ringing");
    }, 120);
}


// ----------------------------
// センサー
// ----------------------------

function startSensor() {

    initAudio();

    if (typeof DeviceMotionEvent === "undefined") {

        document.getElementById("status").textContent =
            "この端末ではモーションセンサーが使えません";

        return;
    }


    // iPhone系
    if (
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {

        DeviceMotionEvent.requestPermission()
            .then(permission => {

                if (permission === "granted") {

                    window.addEventListener(
                        "devicemotion",
                        handleMotion
                    );

                    document.getElementById("status").textContent =
                        "準備完了！スマホを振ってください";
                }

            })
            .catch(() => {

                document.getElementById("status").textContent =
                    "センサーが許可されませんでした";
            });

    } else {

        window.addEventListener(
            "devicemotion",
            handleMotion
        );

        document.getElementById("status").textContent =
            "準備完了！スマホを振ってください";
    }
}


// ----------------------------
// 振動検出
// ----------------------------

function handleMotion(event) {

    const acc = event.accelerationIncludingGravity;

    if (!acc) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;

    const magnitude =
        Math.sqrt(x*x + y*y + z*z);


    // 急激な変化
    const delta =
        Math.abs(magnitude - lastMagnitude);

    lastMagnitude = magnitude;


    if (delta > shakeThreshold) {

        const now = Date.now();

        // 連続誤検出防止
        if (now - lastShake > 280) {

            lastShake = now;

            // 振る強さ
            let volume =
                Math.min(delta / 20, 1.4);

            playBell(
                currentNote,
                volume
            );
        }
    }
}


// ----------------------------
// センサー開始ボタン
// ----------------------------

document.getElementById("enable")
    .addEventListener("click", () => {

        startSensor();

    });

</script>

</body>
</html>
