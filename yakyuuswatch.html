
<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Pro - Final Production</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <style>
        :root {
            --bg-base: #B2DFDB; 
            --lcd-bg: #c4dbd8;
            --text-standard: #004D40;
            --alert-yellow: #FFEB3B;
            --alert-red: #FF1744;
            --accent-red: #D32F2F;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            background-color: var(--bg-base);
            user-select: none;
        }

        #bg-wipe-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; background: transparent; }

        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; z-index: 2; }

        .console { 
            width: 95%; max-width: 480px; height: 42%; 
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            box-sizing: border-box; position: relative; z-index: 10;
        }

        .top-row { display: grid; grid-template-columns: 1fr 110px; align-items: flex-end; gap: 20px; }

        #reset-btn { 
            height: 45px; background: linear-gradient(to bottom, #26A69A, #00897B); 
            border: none; border-radius: 12px; color: white; font-weight: bold; 
            box-shadow: 0 4px #004D40; cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
            font-size: 1.2rem; white-space: nowrap; padding: 0 10px;
        }
        #reset-btn:active { transform: translateY(3px); box-shadow: 0 1px #004D40; }

        #start-stop-btn { 
            height: 85px; background: linear-gradient(to bottom, #26A69A, #009688); 
            border: none; border-radius: 20px; color: white; font-size: 1.1rem; font-weight: bold; 
            box-shadow: 0 6px #00796B; cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
        }
        #start-stop-btn:active { transform: translateY(4px); box-shadow: 0 2px #00796B; }
        
        @keyframes pulse-red-alert {
            0% { background: linear-gradient(to bottom, #26A69A, #00897B); }
            10% { background: linear-gradient(to bottom, #FF5252, #FF1744); }
            50% { background: linear-gradient(to bottom, #FF5252, #FF1744); }
            60% { background: linear-gradient(to bottom, #26A69A, #00897B); }
            100% { background: linear-gradient(to bottom, #26A69A, #00897B); }
        }

        @keyframes pulse-red-alert-start {
            0% { background: linear-gradient(to bottom, #26A69A, #009688); }
            10% { background: linear-gradient(to bottom, #FF5252, #FF1744); }
            50% { background: linear-gradient(to bottom, #FF5252, #FF1744); }
            60% { background: linear-gradient(to bottom, #26A69A, #009688); }
            100% { background: linear-gradient(to bottom, #26A69A, #009688); }
        }

        @keyframes bounce { 
            0%, 100% { transform: scale(1); } 
            25% { transform: scale(1.15); } 
            50% { transform: scale(1); } 
        }
     @keyframes time-signal-pulse {
    0%   { transform: scale(1); }

    15%  { transform: scale(2.4); }

    22%  { transform: scale(2.4); }

    35%  { transform: scale(1); }

    100% { transform: scale(1); }
}



.time-alert-yellow {
    background: linear-gradient(to bottom, #FFF176, #FBC02D) !important;
    animation: time-signal-pulse 2s infinite;
    z-index: 100;
}
      @keyframes time-signal-pulse-slow {
    0%   { transform: scale(1); }

    6%   { transform: scale(3.5); }

    9%   { transform: scale(3.5); }

    14%  { transform: scale(1); }

    100% { transform: scale(1); }
}

.time-alert-yellow-slow {
    background: linear-gradient(to bottom, #FFF176, #FBC02D) !important;
    animation: time-signal-pulse-slow 5s infinite;
    z-index: 100;
}


        @keyframes time-signal-pulse-red {
    0%   { transform: scale(1); }

    15%  { transform: scale(3.8); }

    22%  { transform: scale(3.8); }

    35%  { transform: scale(1); }

    100% { transform: scale(1); }
}
        .time-alert-red {
    background: linear-gradient(to bottom, #FF5252, #D50000) !important;
    animation: time-signal-pulse-red 2s infinite;
    z-index: 100;
}



        .btn-alert-active-reset { animation: pulse-red-alert 1.2s infinite linear, bounce 1.2s infinite linear; }
        .btn-alert-active-start { animation: pulse-red-alert-start 1.2s infinite linear; }

        #display-panel { 
            background-color: var(--lcd-bg); padding: 15px 20px; border-radius: 25px; 
            border: 10px solid #75bdb3; box-shadow: inset 8px 8px 16px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; flex-grow: 1; justify-content: center;
            transition: transform 0.05s; cursor: pointer;
        }
        #display-panel:active { transform: scale(0.98); }

        .label { font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; color: #00796B; opacity: 0.8; margin-bottom: 2px; }
        .clock-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
        #clock-val {
    color: #2F7F76;     
    font-size: 3.4rem;   
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    line-height: 1;
}
        #main-time { color: var(--text-standard); font-size: 4.4rem; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
        .running-text { color: var(--accent-red) !important; }
        .divider { border: none; border-top: 2px solid rgba(0, 77, 64, 0.1); margin: 8px 0; }
        .video-space { flex-grow: 1; width: 100%; }

        #ura-text-container { display: inline-flex; justify-content: center; align-items: center; width: 200px; height: 2.8rem; }
        #ura-text { font-family: sans-serif; font-size: 1.8rem; font-weight: bold; color: var(--alert-red); white-space: nowrap; display: inline-block; opacity: 0; transition: transform 0.01s linear, opacity 0.1s linear; }
  
    
 #time-log {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    width: 320px;
    margin: 0 auto;
    border: none; /* ← 枠を消す */
}

#col-left, #col-right {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 140px;
    min-height: 200px;
    border: none; /* ← 境界線を消す */
    background: transparent;
}

#col-left, #col-right {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 140px;
    min-height: 200px; /* ここで空でも高さを確保する */
    background: transparent; /* もちろん透明のままで大丈夫 */
}
.time-item {
    font-size: 1.2rem;
    font-family: monospace;
    font-weight: bold;
    color: #004D40;
}
     .shortcut-btns {
    display: flex;
    justify-content: center;
    gap: 10px; /* 少しだけ隙間を詰めて、ボタンを大きくする余裕を作るよ */
    margin: 10px 0;
    width: 100%; /* 親の幅いっぱいに */
}

.shortcut-btns button {
    flex: 1; /* これで3つのボタンが均等に横に広がるよ */
    max-width: 120px; /* 広がりすぎないように制限 */
    padding: 15px 0; /* 高さをしっかり出す */
    background: linear-gradient(to bottom, #80CBC4, #4DB6AC);
    color: #004D40;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px #00695C;
    transition: transform 0.05s, box-shadow 0.05s;
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
    font-size: 1.2rem; /* 文字も少し大きく */
}

.shortcut-btns button:active { 
    transform: translateY(3px); 
    box-shadow: 0 1px #00695C; 
}
.left-panel {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.clock-offset-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
}

#offset-display {
    width: 50px;
    text-align: right;
    font-size: 0.8rem;
    font-weight: bold;
    color: #004D40;
}

#clock-offset-slider {
    flex: 1;  accent-color: #00897B;
}
        
    
/* ===== STOPWATCH / LARGE: source design ===== */
#mode-selector-wrap { position: fixed; top: 25px; left: 25px; width: 80px; height: 80px; z-index: 120; }
#mode-selector {
    width: 80px; height: 80px;
    background: linear-gradient(145deg, #80CBC4, #4DB6AC);
    border-radius: 50%; border: 3px solid #00796B;
    position: relative; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
}
#mode-selector.large-dark-lever { background:#222222 !important; border-color:#444444 !important; box-shadow:0 4px 10px rgba(0,0,0,0.4); }
#mode-selector.large-dark-lever #lever-knob { background:linear-gradient(to right,#555,#333,#555) !important; }
#mode-selector.large-dark-lever #lever-knob::after { background:radial-gradient(circle,#555 0%,#333 100%) !important; border-color:#707070 !important; }
#lever-knob {
    width:10px; height:60px; background:linear-gradient(to right,#f0f0f0,#bbb,#f0f0f0);
    border-radius:5px; box-shadow:2px 0 5px rgba(0,0,0,0.2);
    transition:transform .3s cubic-bezier(.175,.885,.32,1.275); transform-origin:center center; position:relative;
}
#lever-knob::after {
    content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:20px; height:20px; background:radial-gradient(circle,#f0f0f0 0%,#bbb 100%);
    border-radius:50%; border:2px solid #999; box-shadow:0 2px 4px rgba(0,0,0,.3);
}
#sw-overlay{
    position:fixed;inset:0;z-index:100;background:#ECEFF1;color:#263238;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;font-family:'Inter',sans-serif;box-sizing:border-box;
}
#sw-console{width:480px;box-sizing:border-box;padding:25px;display:flex;flex-direction:column;gap:25px;}
#sw-title{font-weight:800;letter-spacing:2px;text-align:center;}
#sw-main-display{
    font-variant-numeric:tabular-nums;font-size:clamp(4rem,15vw,7rem);
    font-weight:700;line-height:1;text-align:center;
}
#sw-main-display.running-text{color:#D32F2F;}
#sw-input{
    width:250px;height:50px;border:2px solid #90A4AE;border-radius:10px;
    text-align:center;font-size:1.7rem;font-weight:700;background:#fff;
    margin:0 auto;box-sizing:border-box;
}
#sw-controls,#sw-units{display:flex;gap:10px;justify-content:center;}
#sw-controls button{
    min-width:115px;height:54px;border:0;border-radius:12px;
    background:#546E7A;color:#fff;font-weight:800;
}
#sw-units button{
    border:0;border-radius:8px;padding:8px 18px;background:#B0BEC5;font-weight:800;
}
#sw-keypad{display:grid;grid-template-columns:repeat(3,68px);gap:7px;justify-content:center;}
#sw-keypad button{
    height:48px;border:0;border-radius:9px;background:#CFD8DC;
    font-size:1.1rem;font-weight:800;
}
#large-alert-bg{
    position:absolute;
    inset:0;
    background:#000;
    z-index:0;
}
        
        #large-sw-overlay{
    position:fixed;inset:0;background:#000;z-index:100;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    box-sizing:border-box;overflow:hidden;padding-bottom:50px;
}
#large-time-container{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;white-space:nowrap;
    z-index:1;
}
#large-main-time{
    display:flex;align-items:center;justify-content:center;
    font-size:11rem;font-family:'DS-Digital',monospace;color:#fff;
    border:4px solid #fff;border-radius:20px;padding:35px 55px;
    background:#0d0d0d;
}
#large-main-time .digit{
    width:80px;text-align:right;display:inline-block;margin:0 13px;
    font-style:italic;color:#ff4500;font-family:'DS-Digital',monospace;
}
#large-main-time .separator{
    width:58px;text-align:right;display:inline-block;font-size:1em;
    font-weight:bold;color:#f00;padding-left:6px;font-family:'DS-Digital',monospace;
}
#large-sub-label{
    margin-top:15px;color:#fff;font-size:2.2rem;font-weight:bold;
    letter-spacing:2px;text-align:center;opacity:.8;width:100%;
}
#large-reset-btn{
    position:absolute;bottom:25px;right:25px;width:70px;height:35px;
    background:rgba(255,255,255,.1);border:1.5px solid #707070;border-radius:8px;
    color:#888;font-size:.75rem;font-weight:bold;display:flex;align-items:center;
    justify-content:center;z-index:110;cursor:pointer;
}
@media (max-width:600px){#sw-console{width:100%;padding:20px;}}
</style>
</head>
<body>

    <div id="mode-selector-wrap">
        <div id="mode-selector" onpointerdown="cycleAddedMode(event)"><div id="lever-knob"></div></div>
    </div>

    <div id="sw-overlay">
        <div id="sw-console">
            <div id="sw-title">STOPWATCH</div>
            <div id="sw-main-display">00:00:00</div>
            <input id="sw-input" inputmode="numeric" maxlength="6" placeholder="HHMMSS">
            <div id="sw-controls">
                <button onpointerdown="addedSWStartStop(event)">START / STOP</button>
                <button onpointerdown="addedSWReset(event)">RESET</button>
            </div>
            <div id="sw-units">
                <button onpointerdown="addedSWUnit('h',event)">時</button>
                <button onpointerdown="addedSWUnit('m',event)">分</button>
                <button onpointerdown="addedSWUnit('s',event)">秒</button>
            </div>
            <div id="sw-keypad">
                <button onpointerdown="addedSWNum(1,event)">1</button><button onpointerdown="addedSWNum(2,event)">2</button><button onpointerdown="addedSWNum(3,event)">3</button>
                <button onpointerdown="addedSWNum(4,event)">4</button><button onpointerdown="addedSWNum(5,event)">5</button><button onpointerdown="addedSWNum(6,event)">6</button>
                <button onpointerdown="addedSWNum(7,event)">7</button><button onpointerdown="addedSWNum(8,event)">8</button><button onpointerdown="addedSWNum(9,event)">9</button>
                <button onpointerdown="addedSWClear(event)">C</button><button onpointerdown="addedSWNum(0,event)">0</button><button onpointerdown="addedSWBack(event)">←</button>
            </div>
        </div>
    </div>

    <div id="large-sw-overlay">
        <div id="large-alert-bg"></div>
       <div id="large-reset-btn">RESET</div>
        <div id="large-time-container">
            <div id="large-main-time">
                <span class="digit">0</span><span class="digit">0</span><span class="separator">:</span>
                <span class="digit">0</span><span class="digit">0</span><span class="separator">:</span>
                <span class="digit">0</span><span class="digit">0</span>
            </div>
            <div id="large-sub-label">REAL TIME / TIMER</div>
        </div>
    </div>


    <div id="bg-wipe-layer"></div>

    <div class="console">
       <div class="top-row">

    <div class="left-panel">

        <div class="clock-offset-row">
            <span id="offset-display">+0.0s</span>

            <input
                type="range"
                id="clock-offset-slider"
                min="0"
                max="5"
                step="0.1"
                value="0">
        </div>

        <button id="reset-btn" onpointerdown="handleReset(event)">RESET</button>

    </div>

    <button id="start-stop-btn" onpointerdown="handleStartStop(event)">START<br>STOP</button>

</div>

        <div id="display-panel" onpointerdown="handleStartStop(event)">
            <div class="label">REAL-TIME CLOCK</div>
            <div class="clock-row">
                <div id="clock-val">00:00:00</div>
                <div id="ura-text-container"><div id="ura-text"></div></div>
            </div>
            <div class="divider"></div>
            <div class="label" style="margin-bottom: 2px;">STOPWATCH</div>
            <div id="main-time">00'00"00</div>
        </div>
    </div>
   <div class="shortcut-btns">
    <button onpointerdown="setStartTime(20)">20s</button>
    <button onpointerdown="setStartTime(40)">40s</button>
    <button onpointerdown="setStartTime(60)">60s</button>
</div>
   <div id="time-log">
    <div id="col-left">
        <div class="time-item" style="opacity: 0;">00:00:00</div>
    </div>
    <div id="col-right">
        <div class="time-item" style="opacity: 0;">00:00:00</div>
    </div>
</div>

    <div class="video-space"></div>

    <script>
        let swRunning = false, swStartTime = 0, swElapsedMs = 0, swInterval = null;

        // ===== 独立 STOPWATCH / LARGE =====
        let addedSwRunning=false, addedSwStartTime=0, addedSwElapsedMs=0, addedSwInterval=null, addedSwInput='';
        let addedMode='BASE';
        const addedSWMain=document.getElementById('sw-main-display');
        const addedSWInput=document.getElementById('sw-input');
        const addedLarge=document.getElementById('large-sw-overlay');
        const addedLargeMain=document.getElementById('large-main-time');
        const addedLever=document.getElementById('lever-knob');
        const addedModeSelector=document.getElementById('mode-selector');
        const addedSWOverlay=document.getElementById('sw-overlay');

        function cycleAddedMode(e){
            if(e)e.preventDefault();
            if(addedMode==='BASE') setAddedMode('SW');
            else if(addedMode==='SW') setAddedMode('LARGE');
            else setAddedMode('BASE');
        }
        function setAddedMode(mode){
            addedMode=mode;
            if(mode==='BASE'){
                addedSWOverlay.style.display='none';
                addedLarge.style.display='none';
                document.querySelector('.console').style.display='';
                document.querySelector('.shortcut-btns').style.display='';
                document.getElementById('time-log').style.display='';
                document.body.style.backgroundColor='var(--bg-base)';
                addedModeSelector.classList.remove('large-dark-lever');
                addedLever.style.transform='rotate(-45deg)';
            }else if(mode==='SW'){
                addedSWOverlay.style.display='flex';
                addedLarge.style.display='none';
                document.querySelector('.console').style.display='none';
                document.querySelector('.shortcut-btns').style.display='none';
                document.getElementById('time-log').style.display='none';
                document.body.style.backgroundColor='#ECEFF1';
                addedModeSelector.classList.remove('large-dark-lever');
                addedLever.style.transform='rotate(15deg)';
                updateAddedSWDisplay();
            }else{
                addedSWOverlay.style.display='none';
                addedLarge.style.display='flex';
                document.querySelector('.console').style.display='none';
                document.querySelector('.shortcut-btns').style.display='none';
                document.getElementById('time-log').style.display='none';
                document.body.style.backgroundColor='#000';
                addedModeSelector.classList.add('large-dark-lever');
                addedLever.style.transform='rotate(45deg)';
                updateAddedSWDisplay();
                autoScaleAddedLarge();
            }
        }
        function addedSWNum(n,e){
            if(e)e.preventDefault();
            if(addedSwRunning)return;
            if(addedSwInput.length>=6)return;
            addedSwInput+=String(n);
            addedSWInput.value=addedSwInput;
        }
        function addedSWBack(e){
            if(e)e.preventDefault();
            if(addedSwRunning)return;
            addedSwInput=addedSwInput.slice(0,-1);
            addedSWInput.value=addedSwInput;
        }
        function addedSWClear(e){
            if(e)e.preventDefault();
            if(addedSwRunning)return;
            addedSwInput='';
            addedSWInput.value='';
        }
        function addedSWUnit(unit,e){
            if(e)e.preventDefault();
            if(addedSwRunning || !addedSwInput)return;
            const n=Number(addedSwInput);
            let seconds=0;
            if(unit==='h')seconds=n*3600;
            if(unit==='m')seconds=n*60;
            if(unit==='s')seconds=n;
            seconds=Math.min(seconds,99*3600+59*60+59);
            const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),ss=seconds%60;
            addedSwInput=String(h).padStart(2,'0')+String(m).padStart(2,'0')+String(ss).padStart(2,'0');
            addedSWInput.value=addedSwInput;
        }
        function addedInputToMs(){
            const n=addedSwInput.replace(/\D/g,'').slice(0,6).padStart(6,'0');
            const h=Number(n.slice(0,2)),m=Number(n.slice(2,4)),ss=Number(n.slice(4,6));
            return ((h*60+m)*60+ss)*1000;
        }
        function addedSWStartStop(e){
            if(e)e.preventDefault();
            if(addedSwRunning){
                addedSwElapsedMs=Date.now()-addedSwStartTime;
                addedSwRunning=false;
                clearInterval(addedSwInterval);addedSwInterval=null;
            }else{
                if(addedSwInput){
                    addedSwElapsedMs=addedInputToMs();
                    addedSwInput='';
                    addedSWInput.value='';
                }
                addedSwStartTime=Date.now()-addedSwElapsedMs;
                addedSwRunning=true;
                clearInterval(addedSwInterval);
                addedSwInterval=setInterval(updateAddedSWDisplay,10);
            }
            updateAddedSWDisplay();
        }
        function addedSWReset(e){
            if(e)e.preventDefault();
            addedSwRunning=false;
            clearInterval(addedSwInterval);addedSwInterval=null;
            addedSwElapsedMs=0;
            addedSwStartTime=0;
            addedSwInput='';
            addedSWInput.value='';
            addedLastBlinkSecond=-1;
            updateAddedSWDisplay();
        }
       function updateLargeTimeAlert(){
    if(addedMode !== 'LARGE') return;

    const total = Math.floor(addedSwElapsedMs / 1000);
    const secondInHour = total % 3600;

   if(secondInHour >= 55 * 60 && secondInHour < 58 * 60){
    document.getElementById('large-alert-bg').style.background = 'radial-gradient(circle,#1685ff 0%,#0066ff 45%,#003080 100%)';
document.getElementById('large-alert-bg').style.boxShadow = 'inset 0 0 80px #0088FF, 0 0 80px #0088FF';
}else if(secondInHour >= 58 * 60 && secondInHour < 3600){
    document.getElementById('large-alert-bg').style.background = 'radial-gradient(circle,#ff8a9a 0%,#ff1744 20%,#ff0033 50%,#990020 75%,#40000d 100%)';
document.getElementById('large-alert-bg').style.boxShadow = 'inset 0 0 120px #FF3355, 0 0 120px #FF0033';
       document.getElementById('large-main-time').style.boxShadow = '0 0 6px rgba(255,255,255,1), 0 0 16px rgba(255,255,255,.9), 0 0 32px rgba(255,255,255,.65), 0 0 55px rgba(255,255,255,.35)';
}else{
    document.getElementById('large-alert-bg').style.background = '#000';
document.getElementById('large-alert-bg').style.boxShadow = 'none';

        };

        document.body.addEventListener('pointerdown', () => {

        function updateSW() {
            swElapsedMs = Date.now() - swStartTime;
            let totalSec = Math.floor(swElapsedMs / 1000), subSecMs = swElapsedMs % 1000;
            let activeColor = null, isRedAlert = false, showUraText = false, targetText = "";

            if (totalSec >= 65 && totalSec < 72) { activeColor = 'var(--alert-red)'; isRedAlert = true; showUraText = true; targetText = "～裏しゃべり～"; }
            else if (totalSec >= 100 && totalSec < 107) { activeColor = (totalSec < 105) ? 'var(--alert-yellow)' : 'var(--alert-red)'; isRedAlert = (totalSec >= 105); showUraText = true; targetText = "～ポーズ～"; }
            else if (totalSec >= 57 && totalSec < 65) { activeColor = 'var(--alert-yellow)'; }
            else if (totalSec >= 107 && totalSec < 110) { activeColor = 'var(--alert-red)'; isRedAlert = true; }

            if (activeColor) {
                let progress = 0; const baseColor = 'var(--bg-base)', edgeBlur = 15;
                if (!isRedAlert) {
                    if (subSecMs < 350) { let pos = 150 - ((subSecMs / 350) * 200); bgLayer.style.background = `linear-gradient(135deg, ${baseColor} ${pos}%, ${activeColor} ${pos + edgeBlur}%)`; }
                    else if (subSecMs < 700) { let pos = 150 - (((subSecMs - 350) / 350) * 200); bgLayer.style.background = `linear-gradient(135deg, ${activeColor} ${pos}%, ${baseColor} ${pos + edgeBlur}%)`; }
                    else bgLayer.style.background = 'transparent';
                } else {
                    if (subSecMs < 300) { let pos = 150 - ((subSecMs / 300) * 200); bgLayer.style.background = `linear-gradient(135deg, ${baseColor} ${pos}%, ${activeColor} ${pos + edgeBlur}%)`; }
                    else if (subSecMs < 600) { let pos = 150 - (((subSecMs - 300) / 300) * 200); bgLayer.style.background = `linear-gradient(135deg, ${activeColor} ${pos}%, ${baseColor} ${pos + edgeBlur}%)`; }
                    else bgLayer.style.background = 'transparent';
                }
            } else bgLayer.style.background = 'transparent';

            if (showUraText) {
                if (uraText.innerText !== targetText) uraText.innerText = targetText;
                uraText.style.opacity = "1";
                if (subSecMs < 300) uraText.style.transform = `scale(${1.0 + ((subSecMs / 300) * 0.4)})`;
                else if (subSecMs < 600) uraText.style.transform = `scale(${1.4 - (((subSecMs - 300) / 300) * 0.4)})`;
                else uraText.style.transform = 'scale(1.0)';
            } else { uraText.style.opacity = "0"; uraText.style.transform = 'scale(1.0)'; }

            mainDisplay.innerText = `${String(Math.floor(totalSec/60)).padStart(2,'0')}'${String(totalSec%60).padStart(2,'0')}"${String(Math.floor((swElapsedMs%1000)/10)).padStart(2,'0')}`;
        }

        function clearAlerts() { bgLayer.style.background = 'transparent'; uraText.style.opacity = "0"; uraText.style.transform = 'scale(1.0)'; }

       function updateClock() {
    const now = new Date(Date.now() + clockOffsetMs);
            clockDisplay.innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            
            const totalSecondsNow = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            
            const isInRange1 = (totalSecondsNow >= (0 * 3600 + 25 * 60 + 30) && totalSecondsNow <= (0 * 3600 + 26 * 60 + 2));
            const isInRange2 = (totalSecondsNow >= (18 * 3600 + 2 * 60 + 30) && totalSecondsNow <= (18 * 3600 + 3 * 60 + 2));
            const isInRange3 = (totalSecondsNow >= (18 * 3600 + 17 * 60 + 30) && totalSecondsNow <= (18 * 3600 + 18 * 60 + 2));
            const isInRange4 = (totalSecondsNow >= (18 * 3600 + 22 * 60 + 30) && totalSecondsNow <= (18 * 3600 + 23 * 60 + 2));
const minute = now.getMinutes();
const secInMinute = now.getSeconds();

startStopBtn.classList.remove(
    'time-alert-yellow-slow',
    'time-alert-yellow',
    'time-alert-red'
);

if (minute === 59) {

        startStopBtn.classList.add('time-alert-yellow-slow');

    }
    else if (secInMinute >= 30 && secInMinute < 45) {

        startStopBtn.classList.add('time-alert-yellow');

    else if (secInMinute >= 45) {

        startStopBtn.classList.add('time-alert-red');

    }

}
            if (isInRange1 || isInRange2 || isInRange3 || isInRange4) {

updateLargeTimeAlert();
